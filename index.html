<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PTE Practice Mock Test</title>
<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  text-align: center;
}
.container {
  width: 80%;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 10px;
}
button {
  padding: 10px 20px;
  margin: 10px;
  cursor: pointer;
  border-radius: 5px;
  border: none;
  background: #007bff;
  color: white;
}
.timer {
  font-size: 20px;
  color: red;
}
.question {
  margin: 20px 0;
}
</style>
</head>

<body>

<div class="container">
  <h1>PTE Mock Test</h1>
  <div class="timer" id="timer">Time: 60</div>

  <div id="quiz"></div>

  <button onclick="submitTest()">Submit</button>

  <h2 id="result"></h2>
</div>

<script>
let time = 60;
let timer = setInterval(() => {
  time--;
  document.getElementById("timer").innerText = "Time: " + time;
  if (time <= 0) {
    clearInterval(timer);
    submitTest();
  }
}, 1000);

const questions = [
  {
    q: "Choose the correct word: She ___ going to school.",
    options: ["is", "are", "am"],
    answer: "is"
  },
  {
    q: "Select synonym of 'Happy'",
    options: ["Sad", "Joyful", "Angry"],
    answer: "Joyful"
  },
  {
    q: "Fill blank: He ___ finished his work.",
    options: ["have", "has", "had"],
    answer: "has"
  }
];

function loadQuiz() {
  let quizHTML = "";
  questions.forEach((q, index) => {
    quizHTML += `<div class="question">
      <h3>${q.q}</h3>
      ${q.options.map(opt => `
        <label>
          <input type="radio" name="q${index}" value="${opt}">
          ${opt}
        </label><br>
      `).join("")}
    </div>`;
  });
  document.getElementById("quiz").innerHTML = quizHTML;
}

function submitTest() {
  clearInterval(timer);
  let score = 0;

  questions.forEach((q, index) => {
    let answer = document.querySelector(`input[name="q${index}"]:checked`);
    if (answer && answer.value === q.answer) {
      score++;
    }
  });

  document.getElementById("result").innerText =
    "Your Score: " + score + "/" + questions.length;
}

loadQuiz();
</script>

</body>
</html>
