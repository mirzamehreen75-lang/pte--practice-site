<!DOCTYPE html>
<html>
<head>
  <title>PTE Practice Pro</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f4f4f4;
      text-align: center;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 20px auto;
      width: 60%;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>PTE Mock Test Practice</h1>

<div class="card">
  <h2>⏱ Timer: <span id="timer">60</span> sec</h2>
</div>

<div class="card">
  <h2>Read Aloud</h2>
  <p>Technology is transforming the world at a rapid pace.</p>
  <button onclick="startRecording()">Start Recording</button>
<button onclick="stopRecording()">Stop</button>
<audio id="audio" controls></audio>
</div>

<div class="card">
  <h2>Multiple Choice</h2>
  <p id="question"></p>
  <button onclick="answer(0)" id="opt0"></button>
  <button onclick="answer(1)" id="opt1"></button>
</div>

<div class="card">
  <h2>Score: <span id="score">0</span></h2>
</div>

<script>
let score = 0;

let questions = [
  {
    q: "Choose synonym of 'rapid'",
    options: ["Fast", "Slow"],
    correct: 0
  },
  {
    q: "Choose synonym of 'happy'",
    options: ["Sad", "Joyful"],
    correct: 1
  },
  {
    q: "Choose synonym of 'big'",
    options: ["Large", "Tiny"],
    correct: 0
  }
];

let current = 0;

// Load question
function loadQuestion() {
  document.getElementById("question").innerText = questions[current].q;
  document.getElementById("opt0").innerText = questions[current].options[0];
  document.getElementById("opt1").innerText = questions[current].options[1];
}

// Answer
function answer(i) {
  if (i === questions[current].correct) {
    alert("Correct!");
    score++;
  } else {
    alert("Wrong!");
  }

  updateScore();
  current++;

  if (current < questions.length) {
    loadQuestion();
  } else {
    alert("Test finished!");
  }
}

// Update score
function updateScore() {
  document.getElementById("score").innerText = score;
}

// Timer
let timeLeft = 60;
let timer = setInterval(() => {
  timeLeft--;
  document.getElementById("timer").innerText = timeLeft;

  if (timeLeft <= 0) {
    clearInterval(timer);
    alert("Time's up!");
  }
}, 1000);

// Speaking (demo)
function startSpeaking() {
  alert("Recording started (demo)");
  score++;
  updateScore();
}

// Start first question
loadQuestion();
let mediaRecorder;
let audioChunks = [];

async function startRecording() {
  let stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  mediaRecorder = new MediaRecorder(stream);

  mediaRecorder.start();
  audioChunks = [];

  mediaRecorder.ondataavailable = event => {
    audioChunks.push(event.data);
  };

  alert("Recording started 🎤");
}

function stopRecording() {
  mediaRecorder.stop();

  mediaRecorder.onstop = () => {
    let audioBlob = new Blob(audioChunks);
    let audioUrl = URL.createObjectURL(audioBlob);
    document.getElementById("audio").src = audioUrl;

    alert("Recording stopped ▶️");
  };
}

</body>
</html>
