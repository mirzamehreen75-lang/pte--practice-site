<!DOCTYPE html>
<html>
<head>
  <title>PTE Practice Pro</title>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f4f4f4;
      text-align: center;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 20px auto;
      width: 60%;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    button {
      padding: 10px 20px;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>PTE Mock Test Practice</h1>

<div class="card">
  <h2>⏱ Timer: <span id="timer">60</span> sec</h2>
</div>

<div class="card">
  <h2>Read Aloud</h2>
  <p>Technology is transforming the world at a rapid pace.</p>
  <button onclick="startSpeaking()">Start Speaking</button>
</div>

<div class="card">
  <h2>Multiple Choice</h2>
  <p>Choose synonym of "rapid"</p>
  <button onclick="checkAnswer(true)">Fast</button>
  <button onclick="checkAnswer(false)">Slow</button>
</div>

<div class="card">
  <h2>Score: <span id="score">0</span></h2>
</div>

<script>
let score = 0;

let timeLeft = 60;
let timer = setInterval(() => {
  timeLeft--;
  document.getElementById("timer").innerText = timeLeft;
  if (timeLeft <= 0) {
    clearInterval(timer);
    alert("Time's up!");
  }
}, 1000);

function startSpeaking() {
  alert("Recording started (demo only)");
  score += 1;
  updateScore();
}

function checkAnswer(correct) {
  if (correct) {
    alert("Correct!");
    score += 1;
  } else {
    alert("Wrong!");
  }
  updateScore();
}

function updateScore() {
  document.getElementById("score").innerText = score;
}
</script>

</body>
</html>
